[project]
name = "fantasy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DrewL13", email = "dblayfield13@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
fantasy = "fantasy:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
